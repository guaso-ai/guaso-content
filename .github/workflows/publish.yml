name: Publish npm

# Trusted Publishing (OIDC) — no NPM_TOKEN.
# Prerequisite: package exists on npm + Trusted Publisher configured
# (GitHub Actions → guaso-ai / guaso-content / publish.yml). See PUBLISH.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI supports OIDC
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag '${GITHUB_REF_NAME}' != package.json version '${PKG}'" >&2
            exit 1
          fi

      - name: Publish
        # Auth via OIDC trusted publisher — do not set NODE_AUTH_TOKEN
        run: npm publish --access public
